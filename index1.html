<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Prep Session</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <a href="index.html" class="back-button"><i class="fas fa-arrow-left"></i></a>
    <div class="container">
        <h1>Choose Your Interview Prep Session</h1>
        <div class="card-container">
            <div class="card" id="job-specific">
                <h2>Job-specific</h2>
                <p>Select your job type along with years of experience.</p>
                <div class="image-area">
                    <img src="job_icon.png" alt="Job Icon"> 
                </div>
                <a href="index11.html" class="button">Start Interview</a>
            </div>
            <div class="card" id="custom">
                <h2>Resume Based</h2>
                <p>Select from hundreds of real interview questions asked at real companies.</p>
                <!-- <p>Setup only takes 2 mins.</p> -->
                <div class="image-area">
                    <img src="resume_icon.png" alt="Resume Icon">
                </div>
                <a href="https://preview--resume-question-ninja.lovable.app/" class="button">Build Your Own</a>
            </div>
        </div>
    </div>

    <!-- <a href="index.html" class="back-button">Back</a> -->

</body>
</html>
